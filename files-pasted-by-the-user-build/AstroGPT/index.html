<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b1d"><title>AstroGPT — Your Personal AI Cosmic Guide</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');
:root{--bg:#080b1d;--panel:#121633;--panel2:#181d40;--line:#29305a;--text:#f7f6ff;--muted:#a9afcd;--purple:#a778ff;--pink:#f19bd2;--blue:#6eb6ff;--good:#9cddc1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;border:0}.stars,.stars:before,.stars:after{position:fixed;inset:0;pointer-events:none;content:"";background-image:radial-gradient(circle at 12% 17%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 72% 9%,#cdb9ff 0 1px,transparent 1.5px),radial-gradient(circle at 84% 72%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 25% 90%,#83c5ff 0 1px,transparent 1.5px);background-size:160px 170px,230px 240px,180px 200px,290px 250px;opacity:.45}.stars:before{transform:rotate(23deg);opacity:.32}.stars:after{background:radial-gradient(circle at 88% 15%,rgba(137,94,255,.34),transparent 19%),radial-gradient(circle at 3% 85%,rgba(28,139,255,.19),transparent 25%);filter:blur(12px);opacity:1}.app{position:relative;max-width:520px;min-height:100vh;margin:auto;padding:22px 18px 96px}.hidden{display:none!important}.welcome{min-height:100vh;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:35px 18px}.orb{width:142px;height:142px;border-radius:50%;margin:0 auto 28px;background:radial-gradient(circle at 34% 28%,#f7c6f2,transparent 9%),radial-gradient(circle at 58% 55%,#9261e7,transparent 34%),#3b216b;box-shadow:0 0 60px #7047cf80;animation:float 5s ease-in-out infinite}.logo{font-family:'Playfair Display';font-size:44px;margin:0}.welcome h2{font-size:20px;margin:18px 0 8px}.muted{color:var(--muted);line-height:1.55}.btn{width:100%;padding:15px 18px;border-radius:15px;background:linear-gradient(120deg,#8964ff,#bc7ee8);color:#fff;font-weight:700;margin-top:22px;box-shadow:0 9px 25px #8a64ff44}.link{background:none;color:#cbb8ff;font-weight:700;padding:10px}.screen-title{font-family:'Playfair Display';font-size:27px;margin:7px 0}.eyebrow{color:#c5b2fc;font-size:12px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase}.card{background:linear-gradient(145deg,#171b3aeb,#11152ee8);border:1px solid #2c315a;border-radius:21px;padding:17px;margin:14px 0;box-shadow:0 12px 30px #00000024}.hero{background:linear-gradient(135deg,#392a72,#182f62);overflow:hidden}.hero q{font:21px 'Playfair Display';display:block;line-height:1.3;margin:10px 0 17px}.pill{background:#ffffff14;color:#d8d3ff;padding:7px 10px;border-radius:99px;font-size:12px;display:inline-block}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.section{margin:25px 0 10px;font-size:17px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick button{color:#fff;text-align:left;padding:15px;border-radius:17px;background:#151a38;border:1px solid #2c315a}.quick b{display:block;margin-top:8px;font-size:14px}.quick small{color:var(--muted);line-height:1.3;display:block;margin-top:4px}.indicators{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:13px}.indicator{color:var(--muted);font-size:12px}.indicator b{display:block;color:white;margin-top:4px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:flex;justify-content:space-around;padding:10px 13px 18px;background:#0b0e22ee;backdrop-filter:blur(14px);border-top:1px solid #282e55;z-index:3}.nav button{background:none;color:#8e95b9;font-size:11px}.nav button span{display:block;font-size:21px;margin-bottom:3px}.nav button.active{color:#c5a8ff}.chart-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sign{padding:13px 8px;text-align:center;background:#191e41;border-radius:15px;border:1px solid #2e3563}.sign strong{display:block;font:17px 'Playfair Display';margin:5px 0}.planet{padding:13px 0;border-bottom:1px solid var(--line)}.planet:last-child{border:0}.chat-head{margin-bottom:15px}.online{font-size:12px;color:var(--good)}.messages{min-height:395px;display:flex;flex-direction:column;gap:12px;padding-bottom:16px}.bubble{max-width:88%;padding:13px 14px;border-radius:17px;line-height:1.45;font-size:14px}.ai{background:#181d40;border:1px solid #303861;align-self:flex-start;border-bottom-left-radius:4px}.user{background:linear-gradient(135deg,#7653dd,#9a64d8);align-self:flex-end;border-bottom-right-radius:4px}.meta{font-size:10px;color:#aeb5d7;margin-top:8px}.suggestions{display:flex;flex-wrap:wrap;gap:7px}.suggestions button{padding:9px 11px;color:#e4dcff;background:#1a2045;border:1px solid #343c6b;border-radius:12px;font-size:12px}.composer{position:sticky;bottom:69px;display:flex;gap:8px;background:#0b0e22;padding:9px 0}.composer input{flex:1;background:#181d40;color:white;border:1px solid #373e6c;border-radius:14px;padding:13px}.send{width:48px;border-radius:14px;background:#9269ed;color:white;font-size:19px}.form{display:flex;flex-direction:column;gap:12px}.form input,.form select{width:100%;background:#151a38;color:white;border:1px solid #333962;border-radius:13px;padding:14px}.label{font-size:13px;color:#c7cbed;margin-bottom:-6px}.toggle{display:flex;gap:9px;align-items:center;color:var(--muted);font-size:13px}.progress{height:5px;background:#242a50;border-radius:9px;margin:13px 0 25px}.progress i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#8862ff,#e99bd0)}.notice{font-size:12px;color:var(--muted);padding:11px;background:#ffffff09;border-radius:11px}.history-item{padding:14px 0;border-bottom:1px solid var(--line)}.history-item:last-child{border:0}.history-item button{float:right;background:none;color:#e4b3ff;font-size:17px}.settings button{width:100%;text-align:left;padding:16px 0;background:none;color:white;border-bottom:1px solid var(--line)}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#262d51;color:white;padding:11px 15px;border-radius:13px;font-size:13px;z-index:8;box-shadow:0 5px 20px #000}.modal{position:fixed;inset:0;background:#02030bbf;z-index:9;padding:20px;display:flex;align-items:flex-end}.modal .card{width:min(520px,100%);margin:auto}.close{float:right;background:none;color:white;font-size:23px}@keyframes float{50%{transform:translateY(-10px) rotate(8deg)}}
</style></head><body><div class="stars"></div><main id="root"></main><script>
const K='astrogpt-demo-v1',today=new Intl.DateTimeFormat('en-GB',{dateStyle:'long'}).format(new Date());let state=JSON.parse(localStorage.getItem(K)||'{}');let page='welcome',step=1,chatId=null;
const demo={name:'Aizen',dob:'2007-08-15',time:'10:30 AM',place:'Delhi, India',sun:'Leo',moon:'Pisces',rising:'Scorpio'};const save=()=>localStorage.setItem(K,JSON.stringify(state));const profile=()=>state.profile||demo;const esc=s=>String(s).replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]));
function app(content,nav=true){root.innerHTML='<div class="app">'+content+'</div>'+ (nav?'<nav class="nav"><button onclick="go(\'home\')" class="'+(page==='home'?'active':'')+'"><span>⌂</span>Home</button><button onclick="go(\'chat\')" class="'+(page==='chat'?'active':'')+'"><span>✦</span>AstroGPT</button><button onclick="go(\'chart\')" class="'+(page==='chart'?'active':'')+'"><span>♃</span>My Chart</button><button onclick="go(\'profile\')" class="'+(page==='profile'?'active':'')+'"><span>◉</span>Profile</button></nav>':'')}
function go(p){page=p;render()} function render(){let p=profile();if(page==='welcome')return app('<section class="welcome"><div class="orb"></div><h1 class="logo">AstroGPT</h1><h2>Your Personal AI Cosmic Guide</h2><p class="muted">Understand yourself through<br>AI-powered astrology.</p><button class="btn" onclick="go(\'auth\')">Get Started</button><button class="link" style="margin-top:8px;border:1px solid #4c407d;border-radius:15px" onclick="startDemo()">✨ Explore demo account</button><p class="muted">Already have an account?</p><button class="link" onclick="go(\'auth\')">Log In</button><p class="notice">Demo MVP · astrology-inspired reflection, not factual prediction.</p></section>',false);if(page==='auth')return auth();if(page==='onboard')return onboard();if(page==='home')return home(p);if(page==='chat')return chat(p);if(page==='chart')return chart(p);if(page==='profile')return prof(p);if(page==='daily')return daily(p);if(page==='career')return career(p);if(page==='personality')return personality(p);if(page==='history')return history();}
function auth(){app('<p class="eyebrow">Welcome to AstroGPT</p><h1 class="screen-title">Create your account</h1><p class="muted">Your cosmic profile stays personal to you.</p><form class="form card" onsubmit="signup(event)"><label class="label">Full name</label><input required name="name" placeholder="Your name"><label class="label">Email</label><input required type="email" placeholder="you@example.com"><label class="label">Password</label><input required name="password" type="password" minlength="6" placeholder="At least 6 characters"><label class="label">Confirm password</label><input required name="confirmPassword" type="password" minlength="6" placeholder="Repeat password"><button class="btn" type="submit">Continue</button></form><button class="link" onclick="startDemo()">✨ Continue with demo account</button><button class="link" onclick="go(\'welcome\')">← Back</button>',false)}function signup(e){e.preventDefault();let f=new FormData(e.target),a=f.get('password'),b=f.get('confirmPassword');if(a!==b)return toast('Passwords need to match');state.user={name:f.get('name'),email:f.get('email')};save();page='onboard';render()}function startDemo(){state={user:{name:'Aizen',email:'demo@astrogpt.local',demo:true},profile:{...demo},convos:[{id:Date.now(),title:'Welcome to AstroGPT',date:'Today',messages:[{role:'ai',text:'Welcome, Aizen ✨ I have your demo cosmic profile ready. Ask me about your chart, career, study habits, or today’s reflection.',time:'Now'}]}]};chatId=state.convos[0].id;save();page='home';render();toast('Demo account loaded — your progress is saved locally.')}
function onboard(){let inputs=step===1?'<label class="label">Full name</label><input name="name" required value="'+esc(state.user?.name||'')+'"><label class="label">Date of birth</label><input name="dob" required type="date">':step===2?'<label class="label">Birth time</label><input name="time" type="time"><label class="toggle"><input type="checkbox" name="unknown"> I don’t know my exact birth time</label><p class="notice">That’s okay — some traditional chart interpretations may be less precise.</p>':step===3?'<label class="label">City</label><input name="city" required placeholder="e.g. Delhi"><label class="label">State / region</label><input name="region" placeholder="e.g. Delhi"><label class="label">Country</label><input name="country" required placeholder="e.g. India">':'<div class="card"><p class="eyebrow">Let’s create your cosmic profile ✨</p><p><b>Name:</b> '+esc(state.draft?.name||'')+'</p><p><b>Birth date:</b> '+esc(state.draft?.dob||'')+'</p><p><b>Birth time:</b> '+esc(state.draft?.time||'Not known')+'</p><p><b>Birth place:</b> '+esc(state.draft?.place||'')+'</p></div>';app('<p class="eyebrow">Cosmic profile · Step '+step+' of 4</p><div class="progress"><i style="width:'+step*25+'%"></i></div><h1 class="screen-title">'+(['Tell us about you','When were you born?','Where were you born?','Ready to begin?'][step-1])+'</h1><form class="form" onsubmit="nextStep(event)">'+inputs+'<button class="btn" type="submit">'+(step===4?'Generate My Profile ✨':'Continue')+'</button></form>',false)}function nextStep(e){e.preventDefault();let f=new FormData(e.target);state.draft=state.draft||{};if(step===1)Object.assign(state.draft,{name:f.get('name'),dob:f.get('dob')});if(step===2)state.draft.time=f.get('unknown')?'Not known':(f.get('time')||'Not known');if(step===3)state.draft.place=[f.get('city'),f.get('region'),f.get('country')].filter(Boolean).join(', ');save();if(step++<4)render();else generate()}function generate(){app('<section class="welcome"><div class="orb"></div><h1 class="screen-title">Connecting the cosmic dots...</h1><p class="muted" id="load">✨ Mapping traditional placements...</p></section>',false);setTimeout(()=>{state.profile={...state.draft,sun:'Leo',moon:'Pisces',rising:'Scorpio'};state.convos=[];save();page='home';render()},1600)}
function home(p){app('<p class="muted">Good morning, <b style="color:white">'+esc(p.name)+'</b> 👋</p><h1 class="screen-title">Your cosmic space</h1><article class="card hero"><span class="pill">✦ DAILY COSMIC INSIGHT</span><q>“Focus on progress, not perfection.”</q><div class="row"><span class="muted">Overall energy</span><b>★★★★☆</b></div><button class="link" onclick="go(\'daily\')">Explore today’s insight →</button></article><h3 class="section">Explore</h3><div class="quick"><button onclick="go(\'chat\')">💬<b>Ask AstroGPT</b><small>Chat with your AI guide</small></button><button onclick="go(\'chart\')">🪐<b>My Chart</b><small>Your cosmic profile</small></button><button onclick="go(\'career\')">📚<b>Career & Study</b><small>Discover strengths</small></button><button onclick="go(\'personality\')">✨<b>Personality</b><small>Reflective insights</small></button></div><h3 class="section">Today’s reflection <span class="pill">AI reflection indicators</span></h3><article class="card indicators"><div class="indicator">⚡ Energy<b>High</b></div><div class="indicator">📚 Focus<b>High</b></div><div class="indicator">🌙 Reflection<b>Medium</b></div><div class="indicator">✨ Growth<b>High</b></div></article><article class="card"><span class="pill">Coming soon</span><h3>🌕 Full Moon</h3><p class="muted">A gentle reminder to check in and make space for reflection.</p></article>')}
function chart(p){let planets=[['☀️','Sun','Leo'],['🌙','Moon','Pisces'],['☿','Mercury','Virgo'],['♀','Venus','Cancer'],['♂','Mars','Aries'],['♃','Jupiter','Sagittarius'],['♄','Saturn','Capricorn']];app('<p class="eyebrow">Traditional astrology profile</p><h1 class="screen-title">My Cosmic Chart 🪐</h1><p class="notice">These are demo placements for reflection, not calculated astronomical data.</p><div class="chart-grid">'+[['☀️','Sun Sign',p.sun,'Core identity'],['🌙','Moon Sign',p.moon,'Emotional nature'],['⬆️','Rising',p.rising,'First impression']].map(x=>'<button class="sign" onclick="explain(\''+x[1]+'\',\''+x[2]+'\')">'+x[0]+'<strong>'+x[2]+'</strong><small class="muted">'+x[3]+'</small></button>').join('')+'</div><h3 class="section">Planetary positions</h3><article class="card">'+planets.map(x=>'<div class="planet row"><span>'+x[0]+' '+x[1]+'</span><button class="link" onclick="explain(\''+x[1]+'\',\''+x[2]+'\')">'+x[2]+' ›</button></div>').join('')+'</article>')}
function chat(p){let list=state.convos||[],c=list.find(x=>x.id===chatId)||list[0];if(!c){c={id:Date.now(),title:'A fresh cosmic chat',date:'Today',messages:[]};list.unshift(c);state.convos=list;chatId=c.id;save()}let ms=c.messages.length?c.messages.map(m=>'<div class="bubble '+m.role+'">'+esc(m.text).replace(/\n/g,'<br>')+'<div class="meta">'+m.time+'</div></div>').join(''):'<div class="bubble ai">Hi '+esc(p.name)+' — I’m AstroGPT ✨ Ask me anything about your chart, goals, or today’s themes.<div class="meta">Now</div></div>';app('<header class="chat-head"><div class="row"><div><h1 class="screen-title">✨ AstroGPT</h1><span class="muted">Your Personal Cosmic Guide</span></div><button class="link" onclick="go(\'history\')">History</button></div><span class="online">● Online · reflective guidance</span></header><div class="messages" id="msgs">'+ms+'</div><div class="suggestions">'+['Tell me about my personality','What career suits me?','How can I improve my studies?','What should I focus on today?','Explain my birth chart'].map(x=>'<button onclick="ask(\''+x+'\')">'+x+'</button>').join('')+'</div><form class="composer" onsubmit="send(event)"><input id="ask" required placeholder="Message AstroGPT..."><button class="send">↑</button></form>');setTimeout(()=>document.getElementById('msgs').scrollIntoView(false),50)}
function send(e){e.preventDefault();ask(document.getElementById('ask').value)}async function ask(q){q=q.trim();if(!q)return;let c=state.convos.find(x=>x.id===chatId),time=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});c.messages.push({role:'user',text:q,time});if(c.messages.length===1)c.title=q.length>28?q.slice(0,28)+'…':q;save();render();let typing=document.createElement('div');typing.className='bubble ai';typing.id='typing';typing.innerHTML='✨ AstroGPT is reflecting on your question…';document.getElementById('msgs').append(typing);try{let r=await fetch('http://localhost:3000/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q,profile:profile(),history:c.messages.slice(-12,-1)})}),data=await r.json();if(!r.ok)throw new Error(data.error||'The AI service could not respond.');c.messages.push({role:'ai',text:data.reply,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});save()}catch(err){c.messages.push({role:'ai',text:'I couldn’t reach the AI service right now. Start the AstroGPT server and add a valid OPENAI_API_KEY to the .env file, then try again.\n\nDetails: '+err.message,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});save()}finally{render()}}
function daily(p){app('<p class="muted">Good morning, '+esc(p.name)+' ☀️</p><h1 class="screen-title">Your Cosmic Brief</h1><p class="muted">'+today+'</p><article class="card hero"><span class="pill">ASTROLOGY-INSPIRED REFLECTION</span><h3>✨ Overall theme</h3><p>Today may be a good opportunity to focus on unfinished priorities and avoid unnecessary distractions.</p></article><article class="card"><div class="row"><span>📚 Study & Focus</span><b>★★★★☆</b></div><div class="row"><span>💼 Career & Goals</span><b>★★★★☆</b></div><div class="row"><span>🤝 Social Energy</span><b>★★★☆☆</b></div><div class="row"><span>⚡ Personal Energy</span><b>★★★★☆</b></div></article><article class="card"><h3>🌱 Daily reflection</h3><p>“What is one important task I can complete today?”</p><h3>✨ Daily affirmation</h3><p>I can make progress one step at a time.</p></article><button class="link" onclick="go(\'home\')">← Back to dashboard</button>')}
function career(p){app('<p class="eyebrow">Exploration, not prediction</p><h1 class="screen-title">Career & Study 📚</h1><article class="card"><h3>Natural strengths</h3><p class="muted">Traditional themes from your profile, paired with practical exploration.</p><div class="suggestions"><button>Creative thinking</button><button>Communication</button><button>Leadership</button><button>Problem solving</button></div></article><article class="card"><h3>Potential interests</h3>'+[['Technology & innovation','★★★★☆'],['Creative industries','★★★★☆'],['Research & analysis','★★★★★'],['Business & entrepreneurship','★★★☆☆']].map(x=>'<div class="planet row"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')+'</article><article class="card"><h3>Your study insight</h3><p class="muted">You may benefit from breaking large tasks into smaller goals, using visual notes, studying in focused sessions, and tracking steady progress.</p></article>')}
function personality(p){app('<p class="eyebrow">Reflective profile</p><h1 class="screen-title">Your Cosmic Personality ✨</h1>'+[['🧠 Core personality','You may approach life with a blend of expressive warmth, sensitivity, and focused observation.'],['💪 Your strengths','Creative · Curious · Determined · Adaptable'],['🌱 Growth opportunities','You may sometimes prefer quick progress; practicing patience with long-term goals could be helpful.'],['❤️ Emotional style','You may value imagination and empathy, while benefiting from clear boundaries.'],['🗣️ Communication style','Your ideas can have impact when you share them with clarity and confidence.']].map(x=>'<details class="card"><summary><b>'+x[0]+'</b></summary><p class="muted">'+x[1]+'</p></details>').join(''))}
function history(){let list=state.convos||[];app('<div class="row"><div><p class="eyebrow">Your conversations</p><h1 class="screen-title">Chat history</h1></div><button class="link" onclick="chatId=null;go(\'chat\')">+ New</button></div><input style="width:100%;padding:13px;border-radius:13px;border:1px solid #333962;background:#151a38;color:white" placeholder="🔍 Search conversations" oninput="filterHistory(this.value)"><article class="card" id="hist">'+(list.length?list.map(c=>'<div class="history-item"><button onclick="del('+c.id+')">×</button><div onclick="chatId='+c.id+';go(\'chat\')"><b>✨ '+esc(c.title)+'</b><div class="muted">'+c.date+'</div></div></div>').join(''):'<div class="muted" style="text-align:center;padding:25px">🌌<br><br>No conversations yet.<br>Ask AstroGPT anything.</div>')+'</article>')};function filterHistory(q){document.querySelectorAll('.history-item').forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q.toLowerCase())?'block':'none')}function del(id){state.convos=state.convos.filter(x=>x.id!==id);save();render()}
function prof(p){app('<div class="card hero"><div class="row"><div style="font-size:42px">◉</div><div style="flex:1"><h1 class="screen-title">'+esc(p.name)+'</h1><span class="pill">'+p.sun+' ☀️</span> <span class="pill">'+p.moon+' 🌙</span> <span class="pill">'+p.rising+' ⬆️</span></div></div></div><h3 class="section">Account</h3><div class="card settings"><button onclick="toast(\'Profile editing is available through the birth profile flow.\')">Edit profile ›</button><button onclick="toast(\'Password changes require a connected auth backend.\')">Change password ›</button></div><h3 class="section">Birth profile</h3><div class="card settings"><button onclick="step=1;page=\'onboard\';render()">Edit birth details ›</button><button onclick="generate()">Regenerate astrology profile ›</button></div><h3 class="section">Preferences</h3><div class="card settings"><button onclick="toast(\'Dark mode is active.\')">Appearance · Dark mode ›</button><button onclick="toast(\'Notifications saved locally in demo mode.\')">Notifications ›</button><button onclick="go(\'history\')">Chat history ›</button></div><button class="link" onclick="logout()">Log out</button>')};function explain(type,sign){root.insertAdjacentHTML('beforeend','<div class="modal" onclick="this.remove()"><article class="card" onclick="event.stopPropagation()"><button class="close" onclick="this.closest(\'.modal\').remove()">×</button><p class="eyebrow">Traditional astrology</p><h2>'+sign+' '+type+'</h2><p class="muted">Traditionally, this placement is associated with themes of self-understanding and reflection. You may relate to qualities linked with '+sign+', but your lived experience and choices matter more than any placement.</p></article></div>')};function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),2500)}function logout(){state={};save();page='welcome';render()}render();
</script></body></html>
